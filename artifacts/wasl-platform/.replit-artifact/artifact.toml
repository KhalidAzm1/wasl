kind = "web"
previewPath = "/"
title = "منصة متابعة البنوك - وصل"
version = "1.0.0"
id = "artifacts/wasl-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20541

[services.development]
run = "pnpm --filter @workspace/wasl-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wasl-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/wasl-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20541"
BASE_PATH = "/"
