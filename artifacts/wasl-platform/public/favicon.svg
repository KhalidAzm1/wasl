<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#F5F3FF"/>
  <!-- Light lavender rounded square (left + bottom) -->
  <rect x="96" y="140" width="220" height="240" rx="110" fill="#A78BFA"/>
  <!-- Dark purple rounded rect (right column) -->
  <rect x="260" y="140" width="156" height="240" rx="78" fill="#6D28D9"/>
  <!-- Overlap blend: cut bottom-right of lavender shape to show purple -->
  <rect x="260" y="260" width="156" height="120" rx="0" fill="#6D28D9"/>
  <rect x="260" y="340" width="156" height="40" rx="20" fill="#6D28D9"/>
</svg>
